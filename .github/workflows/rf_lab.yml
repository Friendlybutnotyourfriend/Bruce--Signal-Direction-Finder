name: RF Lab - E32R28T build
on:
  push:
    branches: [codex/rf-black-box-profile-finder]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rf-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test RF Lab algorithms
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/rf_lab_core_test.cpp -o /tmp/rf_lab_test
          /tmp/rf_lab_test
      - name: Install build tools
        run: python -m pip install platformio
      - name: Compile E32R28T HaleHound target
        run: pio run -e e32r28t-halehound
      - name: Save bench-test firmware
        uses: actions/upload-artifact@v4
        with:
          name: rf-lab-e32r28t-bench-test
          path: |
            .pio/build/e32r28t-halehound/firmware.bin
            Bruce-e32r28t-halehound.bin
          if-no-files-found: error
          retention-days: 7
