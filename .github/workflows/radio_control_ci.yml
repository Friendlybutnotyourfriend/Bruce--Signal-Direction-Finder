name: Radio Control Centre - Smoochiee compile

on:
  push:
    branches:
      - agent/radio-control-centre-v1
    paths:
      - "src/modules/radio_control/**"
      - "src/core/menu_items/RFMenu.cpp"
      - "src/core/menu_items/NRF24.cpp"
      - "src/modules/rf/rf_utils.cpp"
      - "src/modules/NRF24/nrf_common.cpp"
      - ".github/workflows/radio_control_ci.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile ESP32-S3 Smoochiee
        run: platformio run -e smoochiee-board
      - name: Upload application artifacts for bench testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radio-control-smoochiee
          path: |
            .pio/build/smoochiee-board/firmware.bin
          if-no-files-found: error
          retention-days: 7
