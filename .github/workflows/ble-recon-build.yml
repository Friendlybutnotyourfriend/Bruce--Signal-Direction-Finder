name: Build BLE Recon V2 UF2

on:
  push:
    branches:
      - ble-recon-nicenano-v2-clean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Zephyr 4.4 workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ble-recon
          toolchains: arm-zephyr-eabi

      - name: Build nice!nano UF2
        run: |
          west build -p always \
            -b promicro_nrf52840/nrf52840/uf2 \
            -S cdc-acm-console \
            ble-recon
          ls -lh build/zephyr/zephyr.uf2 build/zephyr/zephyr.hex build/zephyr/zephyr.bin

      - name: Sanity-check UF2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('build/zephyr/zephyr.uf2')
          b=p.read_bytes()
          assert len(b)%512==0
          addrs=[]
          fams=set()
          for i in range(0,len(b),512):
              blk=b[i:i+512]
              assert int.from_bytes(blk[0:4],'little')==0x0A324655
              assert int.from_bytes(blk[4:8],'little')==0x9E5D5157
              assert int.from_bytes(blk[508:512],'little')==0x0AB16F30
              addrs.append(int.from_bytes(blk[12:16],'little'))
              flags=int.from_bytes(blk[8:12],'little')
              if flags & 0x2000:
                  fams.add(int.from_bytes(blk[28:32],'little'))
          print('UF2 blocks:',len(addrs))
          print('start:',hex(min(addrs)))
          print('family IDs:',[hex(x) for x in fams])
          assert min(addrs)==0x26000, hex(min(addrs))
          assert 0xADA52840 in fams, fams
          PY

      - name: Collect firmware
        run: |
          mkdir -p firmware
          cp build/zephyr/zephyr.uf2 firmware/BLE-Recon-V2-niceNano.uf2
          cp build/zephyr/zephyr.hex firmware/BLE-Recon-V2-niceNano.hex
          cp build/zephyr/zephyr.bin firmware/BLE-Recon-V2-niceNano.bin
          cp build/zephyr/zephyr.map firmware/BLE-Recon-V2-niceNano.map
          sha256sum firmware/* > firmware/SHA256SUMS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Recon-V2-niceNano
          path: firmware/
          if-no-files-found: error
