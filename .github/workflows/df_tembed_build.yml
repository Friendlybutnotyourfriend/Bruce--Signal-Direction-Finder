name: DF Device Builds

on:
  push:
    branches:
      - agent/ble-hunter-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: df-device-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LilyGO T-Embed CC1101 Plus
            env: lilygo-t-embed-cc1101
            artifact: Bruce-DF-T-Embed
          - name: NM-CYD-C5
            env: nm-cyd-c5
            artifact: Bruce-DF-NM-CYD-C5

    steps:
      - name: Checkout DF branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
          python -m pip install --upgrade pip
          pip install platformio requests esptool intelhex

      - name: Build firmware
        run: platformio run -e "${{ matrix.env }}"

      - name: Upload firmware and build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Bruce-*.bin
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: error
          retention-days: 7
