name: Fenrir nRF Black Box Lean1
on:
  push:
    branches: [codex/fenrir-nrf-blackbox-stability]
  workflow_dispatch:
env:
  PYTHONDONTWRITEBYTECODE: 1
permissions:
  contents: read
concurrency:
  group: fenrir-117-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: pio-cache
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: native117-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/**/*.ini') }}
          restore-keys: native117-${{ runner.os }}-
      - name: Host regressions
        run: |
          for flags in '-DFENRIR_EBYTE=1 -DCONFIG_IDF_TARGET_ESP32=1' '-DCONFIG_IDF_TARGET_ESP32=1' '-DFENRIR_EBYTE=1'; do
            g++ -std=c++11 -Wall -Wextra -Werror -DBRUCE_NO_SDR_JAMMER=1 $flags -Itests/stubs/radio_mem -Isrc tests/radio_mem_test.cpp -o /tmp/radio-mem
            /tmp/radio-mem
          done
          g++ -std=c++11 -Wall -Wextra -Werror tests/sentinel_score_test.cpp src/modules/sentinel/sentinel_score.cpp -I src/modules/sentinel -o /tmp/sentinel
          /tmp/sentinel
          for test in rf_lab_core recon_core cbd_stability; do
            g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/${test}_test.cpp -o /tmp/${test}
            /tmp/${test}
          done
          g++ -std=c++17 -Wall -Wextra -Werror tools/recon_replay.cpp -o /tmp/recon-replay
          RECON_ENGINE=/tmp/recon-replay python -m unittest discover -s tests -p 'test_sessions.py'
      - name: Lifecycle and Black Box regressions
        run: |
          python -m unittest discover -s tests -p 'test_ble_lifecycle.py'
          python -m unittest discover -s tests -p 'test_radio_resources.py'
          python -m unittest discover -s tests -p 'test_recon_ram.py'
          g++ -std=c++11 -Wall -Wextra -Werror tests/nrf_blackbox_test.cpp -o /tmp/nrf-blackbox
          /tmp/nrf-blackbox
          g++ -std=c++11 -Wall -Wextra -Werror -Itests/stubs/lazy_ram -Isrc tests/lazy_ram_test.cpp -o /tmp/lazy-ram
          /tmp/lazy-ram
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib libc6-dev-i386
          python -m pip install platformio==6.2.0
      - name: Fenrir full
        id: full
        run: |
          pio run -e fenrir-ebyte
          python scripts/package_fenrir.py --env fenrir-ebyte
          python scripts/report_fenrir_memory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bruce-1.17-Fenrir-Standalone-BlackBox-Lean1
          path: .pio/release/*
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always() && steps.pio-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: ${{ steps.pio-cache.outputs.cache-primary-key }}
