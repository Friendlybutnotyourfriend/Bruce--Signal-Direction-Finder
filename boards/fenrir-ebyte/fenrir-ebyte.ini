; Fenrir / ESP32-2432S028R-PLUS-RF (ZLX-ESP32-4, E07 + E01).
; Dedicated target: classic ESP32, 4MB flash, no PSRAM.
; Integrated E07 transmit remains locked until RF front-end qualification.
[env:fenrir-ebyte]
board = CYD-2432S028
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/fenrir-ebyte>
build_flags =
    ${env.build_flags}
    ${env_4mb.build_flags}
    -Iboards/fenrir-ebyte
    -DFENRIR_EBYTE=1
    -DFENRIR_EBYTE_RX_ONLY=1
    -DFENRIR_E07_RX_EN=0
    -DFENRIR_E07_TX_EN=4
    -DCYD=1
    -DDEVICE_NAME='"Fenrir Ebyte RF"'
    -DCORE_DEBUG_LEVEL=0
    -DHAS_SCREEN=1
    -DHAS_TOUCH=1
    -DROTATION=1
    -DBACKLIGHT=21
    -DMINBRIGHT=160
    -DFP=1
    -DFM=2
    -DFG=3
    -DTXLED=-1
    -DRXLED=-1
    -DLED_ON=HIGH
    -DLED_OFF=LOW
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DTOUCH_CS=33
    -DTOUCH_CONFIG_INT_GPIO_NUM=36
    -DGROVE_SDA=22
    -DGROVE_SCL=35
    -DSPI_SCK_PIN=18
    -DSPI_MISO_PIN=19
    -DSPI_MOSI_PIN=23
    -DSPI_SS_PIN=27
    -DSDCARD_CS=5
    -DSDCARD_SCK=18
    -DSDCARD_MISO=19
    -DSDCARD_MOSI=23
    -DUSE_CC1101_VIA_SPI
    -DCC1101_SCK_PIN=18
    -DCC1101_MISO_PIN=19
    -DCC1101_MOSI_PIN=23
    -DCC1101_SS_PIN=27
    -DCC1101_GDO0_PIN=22
    -DCC1101_GDO2_PIN=35
    -DUSE_NRF24_VIA_SPI
    -DNRF24_SCK_PIN=18
    -DNRF24_MISO_PIN=19
    -DNRF24_MOSI_PIN=23
    -DNRF24_SS_PIN=26
    -DNRF24_CE_PIN=16
    -DRF_TX_PINS='{{"Integrated only",22}}'
    -DRF_RX_PINS='{{"Integrated only",22}}'

lib_deps =
    ${env.lib_deps}
lib_ignore =
    ${env_4mb.lib_ignore}
