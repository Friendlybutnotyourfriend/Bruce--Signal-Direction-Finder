; E32R28T with HaleHound E07/E01 daughterboard: CYD ILI9341 display,
; independent radio chip selects and E07 front-end enables.
[env:e32r28t-halehound]
extends = env:fenrir-ebyte
upload_port = COM38
build_unflags =
    -DST7789_2_DRIVER=1
    -DANALOG_BAT_PIN=34
    -DANALOG_BAT_MULTIPLIER=2.0f
    -DDEVICE_NAME='"Fenrir Ebyte RF"'
build_flags =
    ${env:fenrir-ebyte.build_flags}
    -DE32R28T_HALEHOUND=1
    -DILI9341_2_DRIVER=1
    -DDEVICE_NAME='"HUGINN E32R28T"'
